# Roda os testes a cada envio e em cada pull request, no Windows e no Linux.
# Se algo que protege a empresa (mascaramento, validação de SQL, aprovação, chaves) quebrar, o GitHub avisa.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  documentacao:
    name: Documentação em dia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # docs/03-a-entrevista.md é gerado a partir do código: se alguém mudar a entrevista e esquecer de rodar
      # "npm run docs", este passo falha.
      - run: npm run docs && git diff --exit-code docs/03-a-entrevista.md
